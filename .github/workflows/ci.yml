name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test -DexcludedGroups=integration

      - name: Publish unit test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Unit Test Report
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run integration tests
        run: ./mvnw -B test -Dgroups=integration

      - name: Publish integration test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Integration Test Report
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true
